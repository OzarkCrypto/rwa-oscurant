<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>rwa.oscurant — tokenized stock arb monitor</title>
<meta name="description" content="Real-time tokenized stock arbitrage monitor across CEX, DEX, spot & perp venues"/>
<meta name="theme-color" content="#0a0a0a"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>$</text></svg>"/>
<link rel="stylesheet" href="./styles.css"/>
</head>
<body>
<header>
  <h1>rwa<span class="dim">.oscurant</span></h1>
  <div class="sub">tokenized stock arb monitor · spot + perp · CEX + DEX</div>
</header>

<section class="controls">
  <div class="ctl">
    <div class="ctl-tabs">
      <button id="view-arb" data-v="arb" class="view-tab">arb table</button>
      <button id="view-grid" data-v="grid" class="view-tab">grid</button>
    </div>
  </div>
  <div class="ctl">
    <label>min net <input id="minnet" type="number" step="1" style="width:60px"/> bps</label>
    <label>refresh
      <select id="interval">
        <option value="3">3s</option>
        <option value="5">5s</option>
        <option value="10">10s</option>
        <option value="30">30s</option>
        <option value="60">60s</option>
      </select>
    </label>
    <button id="pause">⏸ pause</button>
  </div>
  <div class="ctl">
    <label>polygon key (opt) <input id="polygon-key" type="password" placeholder="real stock RT" style="width:200px"/></label>
  </div>
  <div class="ctl venues" id="venues"></div>
</section>

<section id="status"></section>
<main id="main"></main>

<footer>
  <span class="muted">no API key required for most venues · arb table excludes index-based perps (USA500/XYZ100/GOLD ratio fuzz)</span>
</footer>

<script type="module" src="./js/main.js"></script>
</body>
</html>
