<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RWA oscurant</title>
<meta name="description" content="RWA Oscurant: Tokenized stock monitoring"/>
<meta name="theme-color" content="#fcfcfb"/>
<meta property="og:title" content="RWA Oscurant"/>
<meta property="og:description" content="RWA Oscurant: Tokenized stock monitoring"/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://rwa.oscurant.xyz/"/>
<meta property="og:site_name" content="RWA Oscurant"/>
<meta name="twitter:card" content="summary"/>
<meta name="twitter:title" content="RWA Oscurant"/>
<meta name="twitter:description" content="RWA Oscurant: Tokenized stock monitoring"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>$</text></svg>"/>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css?v=5"/>
<script src="./js/boot.js?v=5"></script>
</head>
<body>
<div class="c">

<header>
  <a class="brand" href="/">
    <h1>rwa<span class="dim">.oscurant</span></h1>
    <div class="sub">tokenized stock arb · spot + perp · cex + dex</div>
  </a>
  <span class="m" id="updated">—</span>
  <button id="theme-toggle" class="theme-toggle" title="toggle theme">◐</button>
</header>

<section class="controls">
  <div class="ctl">
    <div class="ctl-tabs">
      <button id="view-arb" data-v="arb" class="view-tab">arb</button>
      <button id="view-grid" data-v="grid" class="view-tab">grid</button>
    </div>
  </div>
  <div class="ctl">
    <label>min net <input id="minnet" type="number" step="1" style="width:54px"/> bps</label>
    <label>refresh
      <select id="interval">
        <option value="3">3s</option>
        <option value="5">5s</option>
        <option value="10">10s</option>
        <option value="30">30s</option>
        <option value="60">60s</option>
      </select>
    </label>
    <button id="pause">⏸ pause</button>
  </div>
  <div class="ctl">
    <label>polygon key (opt) <input id="polygon-key" type="password" placeholder="real stock RT" style="width:160px"/></label>
  </div>
  <div class="ctl venues" id="venues"></div>
</section>

<section id="status"></section>
<main id="main"></main>

<footer>
  no API key required for most venues · arb table excludes index-based perps (USA500 / XYZ100 / GOLD ratio fuzz)
</footer>

</div>
<script type="module" src="./js/main.js?v=5"></script>
</body>
</html>
